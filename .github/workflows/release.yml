name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # build/ is committed (the release ships it as is). The zip is the
      # runtime files only: .gitattributes export-ignore drops the dev files
      # and languages/ (translations ship as language packs, see language.yml),
      # and SelfDirectory comes from its submodule.
      - name: Build plugin zip
        id: build
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p /tmp/build
          git archive HEAD --prefix=axellcore-atelierclub/ | tar xf - -C /tmp/build/
          git -C lib/selfdirectory archive HEAD \
            --prefix=axellcore-atelierclub/lib/selfdirectory/ \
            -- class-selfdirectory.php \
            | tar xf - -C /tmp/build/
          cd /tmp/build && zip -qr "axellcore-atelierclub.${tag}.zip" axellcore-atelierclub
          echo "zip=/tmp/build/axellcore-atelierclub.${tag}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload plugin zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.zip }}
          generate_release_notes: true
