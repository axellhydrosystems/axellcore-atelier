name: Tests

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  # ── Plugin header consistency ─────────────────────────────────────────────────
  headers:
    name: Plugin header consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check required header fields exist
        run: |
          check_field() {
            local label=$1 pattern=$2 file=$3
            if ! grep -qE "$pattern" "$file"; then
              echo "✗  '$label' not found in $file"
              exit 1
            fi
            echo "✔  $label: $(grep -oE "$pattern" "$file" | head -1)"
          }

          check_field "Plugin Name"       "Plugin Name:"                       "axellcore-atelier.php"
          check_field "Version"           "Version:[[:space:]]*[0-9]+\.[0-9]"  "axellcore-atelier.php"
          check_field "Requires at least" "Requires at least:[[:space:]]*[0-9]" "axellcore-atelier.php"
          check_field "Requires PHP"      "Requires PHP:[[:space:]]*[0-9]"     "axellcore-atelier.php"
          check_field "License"           "License:[[:space:]]*GPL"            "axellcore-atelier.php"
          check_field "readme Stable tag" "Stable tag:[[:space:]]*[0-9]+\.[0-9]" "readme.txt"

      - name: Version == Stable tag
        run: |
          MAIN=$(grep -oP "(?<=Version:)[[:space:]]*\K\S+" axellcore-atelier.php)
          README=$(grep -oP "(?<=Stable tag:)[[:space:]]*\K\S+" readme.txt)
          [ "$MAIN" = "$README" ] && echo "✔  Version: $MAIN" || { echo "✗  Mismatch: axellcore-atelier.php=$MAIN readme.txt=$README"; exit 1; }

  # ── PHPCS + WPCS + PHPCompatibility ──────────────────────────────────────────
  phpcs:
    name: PHPCS / WPCS / PHP Compat (7.4+)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: $(composer config cache-files-dir)
          key: composer-phpcs-${{ hashFiles('composer.json') }}
          restore-keys: composer-phpcs-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: PHPCS
        run: composer lint

  # ── PHPUnit ──────────────────────────────────────────────────────────────────
  # PHPUnit 10 requires PHP >= 8.1. Production code compat down to PHP 7.4 is
  # checked via PHPCS/PHPCompatibilityWP above, not by running the test suite
  # on 7.4 (phpunit/phpunit itself can't run there).
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3' ]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: $(composer config cache-files-dir)
          key: composer-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: PHPUnit
        run: composer test

      - name: Upload coverage
        if: matrix.php == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage
          path: tests/coverage/

  # ── PHPStan ──────────────────────────────────────────────────────────────────
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: PHPStan
        run: composer analyse
